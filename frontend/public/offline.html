<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5C518" />
    <title>Luckycart Box — You're offline</title>
    <style>
      html, body {
        margin: 0; padding: 0; min-height: 100%;
        background: #020813;
        color: #F8FAFC;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: grid; place-items: center;
      }
      .card {
        max-width: 380px;
        text-align: center;
        padding: 32px;
        border-radius: 20px;
        background: #0B1524;
        box-shadow: 0 20px 60px -10px rgba(245,197,24,0.30), 0 0 0 1px rgba(245,197,24,0.25);
      }
      .icon {
        width: 72px; height: 72px; margin: 0 auto 16px;
        border-radius: 18px;
        background: linear-gradient(135deg,#FFE580,#F5C518);
        display: grid; place-items: center;
        color: #1A1508; font-weight: 800; font-size: 32px;
        box-shadow: 0 6px 20px rgba(245,197,24,0.55);
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: #94A3B8; margin: 0 0 20px; line-height: 1.5; }
      button {
        border: 0; background: linear-gradient(135deg,#FFE580,#F5C518);
        color: #1A1508; font-weight: 800; padding: 12px 24px;
        border-radius: 999px; cursor: pointer; font-size: 14px;
        box-shadow: 0 6px 20px rgba(245,197,24,0.4);
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">↗</div>
      <h1>You're offline</h1>
      <p>Luckycart Box needs a live connection to show up-to-date balances and payment gateways. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
